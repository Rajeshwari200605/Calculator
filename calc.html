<!-- Save as index.html and open in your browser -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Calculator — Simple & Professional</title>
  <style>
    :root{
      --bg:#0b1220; --panel:#0f1724; --btn:#1f2937; --accent:#4f46e5;
      --btn-text:#e6eef8; --muted:#94a3b8; --glass: rgba(255,255,255,0.03);
    }
    *{box-sizing:border-box; font-family:Inter,system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial;}
    html,body{height:100%; margin:0; background:linear-gradient(180deg,#071028 0%, #0b1220 100%); color:var(--btn-text)}
    .wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:28px}
    .calc{
      width:360px; max-width:96vw; background:linear-gradient(180deg,var(--panel), #0c1320);
      border-radius:16px; padding:18px; box-shadow:0 10px 30px rgba(2,6,23,0.7);
    }
    .brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .brand h1{font-size:18px;margin:0}
    .screen{
      background:var(--glass); border-radius:10px; padding:12px 14px; margin-bottom:12px;
      display:flex;flex-direction:column; gap:6px;
    }
    .expr{color:var(--muted); font-size:13px; min-height:16px; word-break:break-all}
    .display{font-size:28px; font-weight:600; text-align:right; min-height:34px; word-break:break-all}
    .keys{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
    button.key{
      padding:14px; border-radius:10px; border:none; cursor:pointer; font-size:16px;
      background:var(--btn); color:var(--btn-text); box-shadow:0 4px 10px rgba(2,6,23,0.4);
      transition:transform .08s ease, box-shadow .08s ease;
    }
    button.key:active{transform:translateY(2px)}
    .key.op{background:linear-gradient(180deg,var(--accent), #3b35c9); color:white; font-weight:700}
    .key.func{background:rgba(255,255,255,0.03); color:var(--muted)}
    .key.zero{grid-column:span 2}
    .footer{margin-top:12px;text-align:center;font-size:12px;color:var(--muted)}
    @media (max-width:380px){
      .display{font-size:24px} .brand h1{font-size:16px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="calc" role="application" aria-label="Calculator">
      <div class="brand">
        <h1>Calculator</h1>
        <div style="font-size:13px;color:var(--muted)">Made with ❤</div>
      </div>

      <div class="screen" aria-live="polite">
        <div id="expr" class="expr"></div>
        <div id="display" class="display">0</div>
      </div>

      <div class="keys">
        <button class="key func" data-action="clear">C</button>
        <button class="key func" data-action="neg">+/-</button>
        <button class="key func" data-action="percent">%</button>
        <button class="key op" data-action="/">÷</button>

        <button class="key" data-num="7">7</button>
        <button class="key" data-num="8">8</button>
        <button class="key" data-num="9">9</button>
        <button class="key op" data-action="*">×</button>

        <button class="key" data-num="4">4</button>
        <button class="key" data-num="5">5</button>
        <button class="key" data-num="6">6</button>
        <button class="key op" data-action="-">−</button>

        <button class="key" data-num="1">1</button>
        <button class="key" data-num="2">2</button>
        <button class="key" data-num="3">3</button>
        <button class="key op" data-action="+">+</button>

        <button class="key zero" data-num="0">0</button>
        <button class="key" data-action=".">.</button>
        <button class="key op" data-action="=">=</button>
      </div>

      <div class="footer">Keyboard support: numbers, + - * / . Enter = Backspace Esc</div>
    </div>
  </div>

  <script>
    // Calculator logic
    (function(){
      const displayEl = document.getElementById('display');
      const exprEl = document.getElementById('expr');
      const keys = document.querySelectorAll('button.key');

      let current = '0';       // shown
      let expression = '';     // full expression for display/eval
      let lastPressed = null;  // 'num' | 'op' | 'eq'

      function updateScreen(){
        displayEl.textContent = current;
        exprEl.textContent = expression;
      }

      function isOperator(ch){ return ['+','-','*','/'].includes(ch); }

      function inputNumber(n){
        if(lastPressed === 'eq'){ expression = ''; }
        if(current === '0' || lastPressed === 'op' || lastPressed === 'eq'){
          current = n;
        } else {
          current = current + n;
        }
        lastPressed = 'num';
        updateScreen();
      }

      function inputDot(){
        if(lastPressed === 'eq'){ current = '0'; expression = ''; }
        if(!current.includes('.')) current += '.';
        lastPressed = 'num';
        updateScreen();
      }

      function applyOperator(op){
        if(lastPressed === 'op'){
          // replace last operator
          expression = expression.slice(0, -1) + op;
        } else {
          expression += (expression === '' ? '' : '') + current + op;
        }
        lastPressed = 'op';
        updateScreen();
      }

      function computeResult(){
        if(lastPressed === 'op'){
          // trailing operator — ignore
          expression = expression.slice(0, -1);
        } else {
          expression += current;
        }
        // Safely evaluate expression using Function (numbers and +-*/ only)
        try{
          // replace any unicode minus signs with normal hyphen
          const safeExpr = expression.replace(/÷/g,'/').replace(/×/g,'*');
          // prevent unsafe chars
          if(/[^0-9+\-*/.%() ]/.test(safeExpr)) throw 'Invalid';
          // evaluate
          const result = Function('"use strict";return (' + safeExpr + ')')();
          current = (Number.isFinite(result) ? String(roundAcc(result, 12)) : 'Error');
        } catch(e){
          current = 'Error';
        }
        expression = '';
        lastPressed = 'eq';
        updateScreen();
      }

      function roundAcc(value, decimals){
        // avoid floating errors
        const factor = Math.pow(10, decimals);
        return Math.round(value * factor) / factor;
      }

      function clearAll(){
        current = '0'; expression = ''; lastPressed = null; updateScreen();
      }

      function toggleNeg(){
        if(current === '0') return;
        if(current.startsWith('-')) current = current.slice(1);
        else current = '-' + current;
        updateScreen();
      }

      function applyPercent(){
        const num = parseFloat(current);
        if(!isFinite(num)) return;
        current = String(num / 100);
        updateScreen();
      }

      function backspace(){
        if(lastPressed === 'eq'){ clearAll(); return; }
        if(current.length <= 1){ current = '0'; }
        else { current = current.slice(0, -1); }
        updateScreen();
      }

      // attach button handlers
      keys.forEach(k => {
        k.addEventListener('click', () => {
          const n = k.dataset.num;
          const act = k.dataset.action;
          if(n !== undefined) { inputNumber(n); return; }
          if(act === '.') inputDot();
          else if(act === 'clear') clearAll();
          else if(act === 'neg') toggleNeg();
          else if(act === 'percent') applyPercent();
          else if(act === 'Backspace') backspace();
          else if(act === '=') computeResult();
          else if(['+','-','*','/'].includes(act)) applyOperator(act);
        });
      });

      // keyboard support
      window.addEventListener('keydown', (e) => {
        if(e.key >= '0' && e.key <= '9'){ inputNumber(e.key); return; }
        if(e.key === '.') { inputDot(); return; }
        if(e.key === 'Enter' || e.key === '='){ computeResult(); return; }
        if(e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/'){ applyOperator(e.key); return; }
        if(e.key === 'Backspace'){ backspace(); return; }
        if(e.key === 'Escape'){ clearAll(); return; }
        // percent with Shift+5 on some keyboards is handled via key '%'
        if(e.key === '%'){ applyPercent(); return; }
      });

      // initial
      updateScreen();
    })();
  </script>
</body>
</html>
